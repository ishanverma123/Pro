[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "supplyguard"
version = "0.2.0"
description = "A local-first software supply-chain security scanner and dashboard"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
supplyguard = "supplyguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"supplyguard.web" = ["*.html", "*.js", "*.css"]
